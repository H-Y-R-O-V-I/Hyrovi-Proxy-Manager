name: HYROVI CI

on:
  push:
    branches:
      - main
      - "hyrovi/**"
  pull_request:
    branches:
      - main

concurrency:
  group: hyrovi-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend lint and schema
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: backend/yarn.lock

      - name: Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Lint
        run: yarn lint

      - name: Validate API schema
        run: yarn validate-schema

      - name: HYROVI Sec challenge client
        working-directory: ${{ github.workspace }}
        run: node scripts/ci/test-hyrovi-challenge-client.mjs

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: frontend/yarn.lock

      - name: Yarn 1
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate

      - name: Install
        run: yarn install --frozen-lockfile

      - name: Compile upstream locales
        run: yarn locale-compile

      - name: Lint
        run: yarn lint

      - name: TypeScript and Vite build
        run: yarn build
