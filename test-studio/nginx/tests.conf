# HYROVI tests.hyrovi.com — isolated first-party lab, proxied by VPS HPM.
# The Cloudflare wildcard tunnel forwards this host over HTTP to the VPS HPM.
server {
    listen 80;
    listen [::]:80;
    server_name tests.hyrovi.com;
    server_tokens off;
    client_max_body_size 2k;
    access_log /data/logs/hyrovi-sec.log hyrovi_sec;
    error_log /data/logs/tests-hyrovi-error.log warn;
    include /data/nginx/hyrovi-security/blocked-ips.conf;
    location / {
        proxy_pass http://172.18.0.1:7346;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header Connection "";
        proxy_hide_header Server;
        proxy_buffering off;
        proxy_connect_timeout 4s;
        proxy_read_timeout 15s;
    }
}
