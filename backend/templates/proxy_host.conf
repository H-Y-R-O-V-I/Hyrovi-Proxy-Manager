{% include "_header_comment.conf" %}

{% if enabled %}

{% include "_hsts_map.conf" %}

server {
  set $forward_scheme {{ forward_scheme }};
  set $server         "{{ forward_host }}";
  set $port           {{ forward_port }};

{% include "_listen.conf" %}
{% include "_certificates.conf" %}
{% include "_assets.conf" %}
{% include "_exploits.conf" %}
{% include "_hsts.conf" %}
{% include "_forced_ssl.conf" %}

{% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
proxy_set_header Upgrade $http_upgrade;
proxy_set_header Connection $http_connection;
proxy_http_version 1.1;
{% endif %}

  access_log /data/logs/proxy-host-{{ id }}_access.log proxy;
  access_log /data/logs/hyrovi-sec.log hyrovi_sec;
  error_log /data/logs/proxy-host-{{ id }}_error.log warn;
  include /data/nginx/hyrovi-security/blocked-ips.conf;
  include /data/nginx/hyrovi-security/host-acl/{{ id }}.conf;
  limit_req zone=hyrovi_sec_rate_limit burst=20 nodelay;

  # HYROVI Sec adaptive proof-of-work challenge. The challenge is only
  # entered from generated proxy locations when the source IP is present
  # in challenged-ips.geo. The verification endpoint itself is exempt.
  error_page 418 = @hyrovi_sec_challenge;

  location @hyrovi_sec_challenge {
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Hyrovi-Sec-Internal "challenge-v1";
    proxy_set_header X-Hyrovi-Sec-Source-IP $remote_addr;
    proxy_set_header X-Hyrovi-Sec-Original-URI $request_uri;
    proxy_set_header Accept $http_accept;
    rewrite ^ /security/challenge/page break;
    proxy_pass http://127.0.0.1:3000;
  }

  # HYROVI first-party analytics endpoints. These never proxy to the upstream
  # application and never receive Authorization/Cookie headers from Nginx.
  location = /.well-known/hyrovi-analytics.js {
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Hyrovi-Analytics-Internal "analytics-v1";
    proxy_set_header X-Hyrovi-Analytics-Source-IP $remote_addr;
    proxy_set_header X-Hyrovi-Analytics-Host $host;
    rewrite ^ /security/analytics/script break;
    proxy_pass http://127.0.0.1:3000;
  }

  location = /.well-known/hyrovi-analytics/collect {
    limit_except POST { deny all; }
    client_max_body_size 16k;
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Content-Type "application/json";
    proxy_set_header X-Hyrovi-Analytics-Internal "analytics-v1";
    proxy_set_header X-Hyrovi-Analytics-Source-IP $remote_addr;
    proxy_set_header X-Hyrovi-Analytics-Host $host;
    proxy_set_header User-Agent $http_user_agent;
    proxy_set_header Accept-Language $http_accept_language;
    proxy_set_header Sec-CH-UA $http_sec_ch_ua;
    proxy_set_header Sec-CH-UA-Mobile $http_sec_ch_ua_mobile;
    proxy_set_header Sec-CH-UA-Platform $http_sec_ch_ua_platform;
    proxy_pass http://127.0.0.1:3000/security/analytics/collect;
  }

  location = /.well-known/hyrovi-sec/challenge {
    proxy_pass_request_headers off;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host $host;
    proxy_set_header X-Hyrovi-Sec-Internal "challenge-v1";
    proxy_set_header X-Hyrovi-Sec-Source-IP $remote_addr;
    proxy_set_header X-Hyrovi-Sec-Original-URI $request_uri;
    proxy_set_header Accept $http_accept;
    proxy_pass http://127.0.0.1:3000/security/challenge/current;
  }

  location = /.well-known/hyrovi-sec/challenge/verify {
    proxy_pass_request_headers off;
    proxy_set_header Host $host;
    proxy_set_header Content-Type "application/json";
    proxy_set_header X-Hyrovi-Sec-Internal "challenge-v1";
    proxy_set_header X-Hyrovi-Sec-Source-IP $remote_addr;
    proxy_set_header X-Hyrovi-Sec-Original-URI $request_uri;
    proxy_pass http://127.0.0.1:3000/security/challenge/verify;
  }

{{ advanced_config }}

{{ locations }}

{% if use_default_location %}

  location / {

{% include "_access.conf" %}
{% include "_hsts.conf" %}

    {% if allow_websocket_upgrade == 1 or allow_websocket_upgrade == true %}
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $http_connection;
    proxy_http_version 1.1;
    {% endif %}

    # Proxy!
    include conf.d/include/proxy.conf;
  }
{% endif %}

  # Custom
  include /data/nginx/custom/server_proxy[.]conf;
}
{% endif %}
