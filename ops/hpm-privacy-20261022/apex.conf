# HYROVI apex privacy page only. Keep the existing HPM fallback for every other path.
# Included from /data/nginx/custom/http.conf in the VPS HPM nginx http{} context.
server {
    listen 80;
    listen [::]:80;
    server_name hyrovi.com;

    access_log /data/logs/hyrovi-privacy-access.log standard;
    error_log /data/logs/hyrovi-privacy-error.log warn;

    location = /datenschutz {
        alias /data/nginx/hyrovi-privacy/datenschutz.html;
        default_type text/html;
        charset utf-8;
        add_header Cache-Control "public, max-age=300" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Content-Security-Policy "default-src 'none'; base-uri 'none'; form-action 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'; frame-ancestors 'none'" always;
    }

    location = /datenschutz/ {
        return 301 https://hyrovi.com/datenschutz;
    }

    # Preserve what hyrovi.com returned before this privacy-only route.
    location / {
        index index.html;
        root /var/www/html;
    }
}
