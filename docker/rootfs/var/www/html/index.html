<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<meta name="robots" content="noindex,nofollow">
		<title>HYROVI Proxy Manager</title>
		<style>
			:root { color-scheme: light dark; font-family: Inter, ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
			* { box-sizing: border-box; }
			body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #101318; color: #f5f7fa; }
			main { width: min(680px, calc(100% - 32px)); border: 1px solid #2c333d; background: #171b22; padding: 32px; }
			.eyebrow { color: #8d98a8; font-size: 12px; font-weight: 700; letter-spacing: .12em; text-transform: uppercase; }
			h1 { margin: 8px 0 12px; font-size: clamp(28px, 6vw, 46px); line-height: 1; }
			p { margin: 0; color: #b8c0cc; line-height: 1.6; }
			.status { margin-top: 24px; border-top: 1px solid #2c333d; padding-top: 18px; display: flex; gap: 10px; align-items: center; color: #dce2ea; }
			.dot { width: 8px; height: 8px; border-radius: 50%; background: #4ade80; }
		</style>
	</head>
	<body>
		<main>
			<div class="eyebrow">HYROVI Proxy Manager</div>
			<h1>Host not configured</h1>
			<p>This address reached the HYROVI gateway, but no matching proxy, redirect or dead-host configuration is active for it.</p>
			<div class="status"><span class="dot"></span><span>Gateway online</span></div>
		</main>
	</body>
</html>
